<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GST Hub Video</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #050505; color: #fff; font-family: Arial, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; padding: 16px; }
    .container { width: min(100%, 720px); }
    .panel { background: rgba(0,0,0,0.92); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 28px; box-shadow: 0 18px 45px rgba(0,0,0,0.45); text-align: center; }
    .panel.hidden { display: none; }
    h1 { font-size: 2rem; margin-bottom: 14px; }
    p { color: #ccc; margin-bottom: 22px; line-height: 1.6; }
    input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.04); color: #fff; font-size: 1rem; margin-bottom: 16px; }
    button { width: 100%; padding: 14px 16px; border-radius: 14px; border: none; background: #1a73e8; color: #fff; font-size: 1rem; cursor: pointer; }
    button:hover { background: #165fbb; }
    .message { min-height: 24px; margin-top: 12px; font-size: 0.95rem; color: #f6b8b8; }
    .video-wrapper { border-radius: 20px; overflow: hidden; background: #000; }
    video { width: 100%; height: auto; display: block; }
    .small-button { width: 100%; margin-top: 18px; background: rgba(255,255,255,0.08); color: #fff; }
    @media (max-width: 520px) { body { padding: 10px; } .panel { padding: 20px; } button { padding: 14px; } }
  </style>
</head>
<body>
  <div class="container">
    <div id="lockPanel" class="panel">
      <h1>Enter Password</h1>
      <p>на це время код 5168</p>
      <input id="passwordInput" type="password" placeholder="Password" autocomplete="off" />
      <button id="checkButton">Unlock</button>
      <div id="message" class="message"></div>
    </div>
      <p style="margin-top:16px; color:#f0d9d9; font-size:1rem;">відео пропало бо люди плакали</p>
      <button id="lockButton" class="small-button">Back to password</button>
    </div>
  </div>
  <script>
    const correctPassword = '5168';
    const lockPanel = document.getElementById('lockPanel');
    const videoPanel = document.getElementById('videoPanel');
    const passwordInput = document.getElementById('passwordInput');
    const message = document.getElementById('message');
    const checkButton = document.getElementById('checkButton');
    const lockButton = document.getElementById('lockButton');

    function showVideo() {
      lockPanel.classList.add('hidden');
      videoPanel.classList.remove('hidden');
      message.textContent = '';
    }

    function showLock() {
      sessionStorage.removeItem('gstHubAccess');
      videoPanel.classList.add('hidden');
      lockPanel.classList.remove('hidden');
      passwordInput.value = '';
      message.textContent = '';
    }

    checkButton.addEventListener('click', () => {
      const value = passwordInput.value.trim();
      if (value === correctPassword) {
        sessionStorage.setItem('gstHubAccess', 'true');
        showVideo();
      } else {
        message.textContent = 'Wrong password. Please try again.';
      }
    });

    passwordInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') checkButton.click();
    });

    lockButton.addEventListener('click', showLock);

    if (sessionStorage.getItem('gstHubAccess') === 'true') {
      showVideo();
    }
  </script>
</body>
</html>
